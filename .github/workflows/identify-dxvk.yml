name: One-time DXVK identify

on:
  push:
    branches:
      - feature/client-tweaks
    paths:
      - .github/workflows/identify-dxvk.yml

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare bundled d3d9 against official DXVK releases
        shell: bash
        run: |
          set -euo pipefail
          echo "Bundled:"
          sha256sum Payload/DXVK_Standard/d3d9.dll
          stat -c '%s bytes' Payload/DXVK_Standard/d3d9.dll

          for ver in 2.6 2.6.1 2.6.2; do
            echo
            echo "DXVK $ver"
            curl -fL --retry 3 -o "/tmp/dxvk-$ver.tar.gz"               "https://github.com/doitsujin/dxvk/releases/download/v$ver/dxvk-$ver.tar.gz"
            tar -xzf "/tmp/dxvk-$ver.tar.gz" -C /tmp
            sha256sum "/tmp/dxvk-$ver/x32/d3d9.dll"
            stat -c '%s bytes' "/tmp/dxvk-$ver/x32/d3d9.dll"
            cmp -s Payload/DXVK_Standard/d3d9.dll "/tmp/dxvk-$ver/x32/d3d9.dll"               && echo "MATCH=v$ver" || echo "NO_MATCH=v$ver"
            rm -rf "/tmp/dxvk-$ver" "/tmp/dxvk-$ver.tar.gz"
          done
