name: Apply independent Vanilla Tweaks policy

on:
  push:
    branches:
      - 'test/remote-fallbacks'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run independent tweak migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/remote-fallbacks

      - name: Apply migration
        run: python scripts/apply_tweak_policy.py

      - name: Validate changes
        run: |
          python -m py_compile setup_tool.py setup_tool_dynamic.py remote_packages.py tests/test_safety.py
          python -m unittest discover -s tests -v

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup_tool.py tests/test_safety.py
          git diff --cached --check
          git commit -m "Keep Vanilla Tweaks independent from SuperWoW"
          git push origin HEAD:test/remote-fallbacks
