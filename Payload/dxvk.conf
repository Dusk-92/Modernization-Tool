# -------------------------------------------------------------------------
# TURTLE WOW / VANILLA 1.12 - DXVK 2.6.1 x86
# -------------------------------------------------------------------------
#
# Keep this file intentionally small. Every active option below is supported
# by the bundled official DXVK 2.6.1 x32 d3d9.dll.
#
# The 32-bit client can run out of address space when D3D9 reports too much
# texture memory. 2048 MiB is a conservative cap also used by current
# Turtle-compatible launcher configurations.
d3d9.maxAvailableMemory = 2048

# Keep the CPU render queue short for responsive input.
d3d9.maxFrameLatency = 1

# Limit shader compiler workers to reduce transient memory pressure in the
# 32-bit process while still allowing parallel compilation.
dxvk.numCompilerThreads = 2

# Use Graphics Pipeline Library when the Vulkan driver supports it.
dxvk.enableGraphicsPipelineLibrary = Auto

# On 32-bit applications DXVK can aggressively release pipeline libraries to
# save address space. Auto enables the appropriate DXVK behaviour.
dxvk.trackPipelineLifetime = Auto

# Avoid Vulkan exclusive-fullscreen opt-in on Windows. This improves alt-tab
# reliability and is also DXVK 2.6.1's default.
dxvk.allowFse = False

# VanillaFixes already handles process DPI awareness for this client.
d3d9.dpiAware = False
